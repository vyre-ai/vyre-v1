[package]
name = "vyre-desktop"
version = "1.0.0-rc.20"
description = "Vyre desktop shell: Tauri 2 around the web build, with the vyred device daemon as a sidecar"
edition = "2021"
license = "MIT"
rust-version = "1.77"

[lib]
name = "vyre_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Every crate here is MIT or Apache-2.0 (checked by cargo deny in license-check, deny.toml).
# No OS credential-store crate on purpose: the replica key is wrapped in IndexedDB, as on web (ARCH 5.10).
[dependencies]
# "unstable": a window can hold a second webview (Window::add_child), which is how the artifact viewer shows a page of its own host as a top-level page (src/artifact_view.rs)
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-shell = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "zip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
flate2 = "1"
rusqlite = { version = "0.32", features = ["bundled"] }

# The one AppKit call the launch needs (lib.rs, set_window_alpha).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true

# Tauri's own signature check (the minisign-verify crate) runs in the tests against a fixture made by scripts/release/updater.ts, so a format drift fails here and not at the first release.
[dev-dependencies]
minisign-verify = "0.2"
