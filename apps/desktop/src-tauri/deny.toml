# cargo deny check licenses --manifest-path apps/desktop/src-tauri/Cargo.toml (ARCH 2.2 B6, run by license-check).
[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Unicode-DFS-2016", "Zlib", "MPL-2.0", "CC0-1.0", "0BSD", "BSL-1.0"]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
deny = [
  { name = "keyring" },
]

[advisories]
ignore = []
