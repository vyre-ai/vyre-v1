# cargo deny licenses for the desktop shell (P-L11_23). The same list as scripts/license-check.ts: MIT, Apache-2.0, BSD, ISC, and MPL-2.0 (file-level). Everything else, AGPL, GPL, LGPL and SSPL included, is rejected.
[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "MPL-2.0", "Unicode-3.0", "Unicode-DFS-2016", "Zlib", "CC0-1.0"]
confidence-threshold = 0.8
