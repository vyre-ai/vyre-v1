[package]
name = "vyre-desktop"
version = "0.0.0"
description = "Vyre desktop shell (spike S12)"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.77"

[lib]
name = "vyre_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
