name: main
# Merge to main, budget 10 minutes (ARCH-DECISIONS 13). P-CI_06: about 30 merges an hour saturated the runners, so
#   push            tests affected since the previous main commit (plus the contracts gate)
#   schedule        the whole suite and golden flows, hourly (perf files excluded: perf.yml runs them)
#   dispatch        the same (also run before a release tag)
# Lead decision (25 Oct): main runs no perf jobs at all (perf.yml is the full perf set, hourly and on dispatch; PRs run the affected perf files), and a push selects against the previous main commit (github.event.before).
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
concurrency:
  group: main-${{ github.event_name == 'push' && 'push' || 'full' }}
  # one run at a time, the newest waiting run replaces older waiting ones; never cancel a running one, or no run turns green and the base never advances
  cancel-in-progress: false
jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: read, actions: read }
    outputs:
      matrix: ${{ steps.sel.outputs.matrix }}
      has_tests: ${{ steps.sel.outputs.has_tests }}
      full: ${{ steps.sel.outputs.full }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Pick the base (the previous main commit on a push, none for a full run), shard by measured time (up to 8 fast shards, slow list as parallel jobs)
        id: sel
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
        run: |
          base=""
          if [ "$EVENT" = "push" ]; then
            base="$BEFORE"   # the previous main commit: each push verifies exactly what it brought, not everything since the last green run (lead decision, 25 Oct)
            echo "$base" | grep -Eq '^0+$' && base=""
            git cat-file -e "${base:-x}^{commit}" 2>/dev/null || base=""
          fi
          if [ -n "$base" ]; then echo "select: affected since the previous main commit $base"; echo "full=false" >> "$GITHUB_OUTPUT"
          else echo "select: whole suite ($EVENT)"; echo "full=true" >> "$GITHUB_OUTPUT"; fi
          # Lead decision: main runs no perf jobs at all; perf is perf.yml (hourly, dispatch) and the affected perf files on PRs.
          node scripts/ci-select.ts "$base" --matrix --max 8 --no-perf > select.json
          node -e 'const r=JSON.parse(require("fs").readFileSync("select.json","utf8"));const n=r.matrix.include.length;console.log("select: "+n+" jobs; "+(r.all?"everything":r.files.length+" affected files"));const o=process.env.GITHUB_OUTPUT;require("fs").appendFileSync(o,"has_tests="+(n>0)+"\nmatrix="+JSON.stringify(n>0?r.matrix:{include:[{name:"none",files:"",slow:"false"}]})+"\n")'
  shards:
    name: ${{ matrix.name }}
    needs: select
    if: needs.select.outputs.has_tests == 'true'
    runs-on: ${{ matrix.runner == 'hosted' && 'ubuntu-latest' || fromJSON(format('["self-hosted","linux","{0}"]', matrix.runner || 'v1')) }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - name: Exclusive disk for a perf job (waits for the Docker-heavy jobs on this host)
        if: matrix.runner == 'v1-perf'
        run: bash scripts/ci-iolock.sh exclusive
      - uses: ./.github/actions/deps
      - name: Run the shard (20 s file cap, pass cache by import hash)
        env:
          FILES: ${{ matrix.files }}
          SLOW: ${{ matrix.slow }}
          VYRE_PERF_RUN: ${{ matrix.runner == 'v1-perf' && '1' || '' }}   # perf files run only on the pinned perf host (test-run skips them elsewhere)
        run: |
          if [ "$SLOW" = "true" ]; then node scripts/test-run.ts --slow --files $FILES; else NC=""; [ "$RUNNER_ENVIRONMENT" = "github-hosted" ] && NC="--no-cache"; node scripts/test-run.mjs --files $FILES $NC; fi  # a hosted VM never reads a shared pass cache
  golden-main:
    needs: select
    if: needs.select.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/deps
      - run: npm run golden
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: tools/gen/check.sh
  merge-ok:
    needs: [select, shards, golden-main, contracts]
    # a skipped job (affected run: golden and perf; no affected tests: shards) is fine, a failed or cancelled one is not
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "merge ok"
  budget-main:
    permissions: { contents: read, actions: read }
    needs: [shards, golden-main, contracts, merge-ok]
    if: always()
    runs-on: [self-hosted, linux, v1]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Wall time of this run against the 10 minute main budget
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-budget.ts --kind main --run-id ${{ github.run_id }} --repo ${{ github.repository }}
      - name: Job times
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-report.ts --run-id ${{ github.run_id }} --repo ${{ github.repository }} >> "$GITHUB_STEP_SUMMARY"
