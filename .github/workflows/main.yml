name: main
# Merge to main, budget 10 minutes (ARCH-DECISIONS 13). P-CI_06: about 30 merges an hour saturated the runners, so
#   push            affected tests since the last green main run (plus the contracts gate); a red run re-includes its changes next time
#   schedule        the whole suite, golden flows and perf, hourly
#   dispatch        the whole suite, golden flows and perf (also run before a release tag)
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
concurrency:
  group: main-${{ github.event_name == 'push' && 'push' || 'full' }}
  # one run at a time, the newest waiting run replaces older waiting ones; never cancel a running one, or no run turns green and the base never advances
  cancel-in-progress: false
jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: read, actions: read }
    outputs:
      matrix: ${{ steps.sel.outputs.matrix }}
      has_tests: ${{ steps.sel.outputs.has_tests }}
      full: ${{ steps.sel.outputs.full }}
    steps:
      - uses: actions/checkout@v5
        with:
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
          fetch-depth: 0
      - name: Pick the base (last green main run on a push, none for a full run), shard by measured time (up to 8 fast shards, slow list as parallel jobs)
        id: sel
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
        run: |
          base=""
          if [ "$EVENT" = "push" ]; then
            base="$(node -e 'fetch("https://api.github.com/repos/"+process.env.REPO+"/actions/workflows/main.yml/runs?branch=main&status=success&per_page=1",{headers:{authorization:"Bearer "+process.env.GH_TOKEN,accept:"application/vnd.github+json"}}).then((r)=>r.json()).then((j)=>console.log(j.workflow_runs?.[0]?.head_sha??"")).catch(()=>console.log(""))')"
            git cat-file -e "${base:-x}^{commit}" 2>/dev/null || base=""
          fi
          if [ -n "$base" ]; then echo "select: affected since last green main $base"; echo "full=false" >> "$GITHUB_OUTPUT"
          else echo "select: whole suite ($EVENT)"; echo "full=true" >> "$GITHUB_OUTPUT"; fi
          node scripts/ci-select.ts "$base" --matrix --max 8 > select.json
          node -e 'const r=JSON.parse(require("fs").readFileSync("select.json","utf8"));const n=r.matrix.include.length;console.log("select: "+n+" jobs; "+(r.all?"everything":r.files.length+" affected files"));const o=process.env.GITHUB_OUTPUT;require("fs").appendFileSync(o,"has_tests="+(n>0)+"\nmatrix="+JSON.stringify(n>0?r.matrix:{include:[{name:"none",files:"",slow:"false"}]})+"\n")'
  shards:
    name: ${{ matrix.name }}
    needs: select
    if: needs.select.outputs.has_tests == 'true'
    runs-on: ${{ (matrix.runner == 'v1-perf' || matrix.slow == true) && fromJSON(format('["self-hosted","linux","{0}"]', matrix.runner || 'v1')) || 'ubuntu-latest' }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/deps
      - name: Run the shard (20 s file cap, pass cache by import hash)
        env:
          FILES: ${{ matrix.files }}
          SLOW: ${{ matrix.slow }}
        run: |
          if [ "$SLOW" = "true" ]; then node scripts/test-run.ts --slow --files $FILES; else node scripts/test-run.mjs --files $FILES; fi
  golden-main:
    needs: select
    if: needs.select.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/deps
      - run: npm run golden
  perf:
    needs: select
    if: needs.select.outputs.full == 'true'
    runs-on: [self-hosted, linux, v1]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/deps
      - run: npm run perf
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: tools/gen/check.sh
  merge-ok:
    needs: [select, shards, golden-main, perf, contracts]
    # a skipped job (affected run: golden and perf; no affected tests: shards) is fine, a failed or cancelled one is not
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "merge ok"
  budget-main:
    permissions: { contents: read, actions: read }
    needs: [shards, golden-main, perf, contracts, merge-ok]
    if: always()
    runs-on: [self-hosted, linux, v1]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Wall time of this run against the 10 minute main budget
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-budget.ts --kind main --run-id ${{ github.run_id }} --repo ${{ github.repository }}
      - name: Job times
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-report.ts --run-id ${{ github.run_id }} --repo ${{ github.repository }} >> "$GITHUB_STEP_SUMMARY"
