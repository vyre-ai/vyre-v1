name: shots
# Side-by-side screenshots of real screens (Expo web export) against the prototype, paper and graphite, plus the theme_flash probe (ruling 14, ruling 21).
# Runs on any branch push that touches ui, apps/app or the tooling; targets live in scripts/shots/targets.json and scripts/shots/targets/*.json.
# The artifact `shots` holds <target>/<skin>-<size>-side-by-side.png and index.md. Dispatch `lockfile` to produce package-lock.json (never npm on the Mac).
on:
  push:
    branches-ignore: [main]
    paths: ["scripts/shots/**", "ui/**", "apps/app/**", "budgets.json", ".github/workflows/shots.yml"]
  workflow_dispatch:
    inputs:
      lockfile:
        description: "Only generate package-lock.json and upload it as the artifact `lockfile`"
        required: false
        default: "false"
concurrency:
  group: shots-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lockfile:
    if: github.event_name == 'workflow_dispatch' && inputs.lockfile == 'true' || contains(github.event.head_commit.message, '[lockfile]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Resolve the dependency tree into package-lock.json
        run: node scripts/shots/lockfile.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: lockfile
          path: package-lock.json
          retention-days: 7
  shots:
    # GitHub-hosted again: the repo is public, hosted minutes are free (25 Oct). The 120 s export budget is a wall-time report here, never a speed gate (ruling 46).
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deps
      - name: Export the web build and take side-by-side screenshots (export reported; 600 s cap on self-hosted)
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        # A packet branch (build/P-L9b_02) shoots only its own targets; main and other branches shoot all.
        run: |
          T=all
          case "$BRANCH" in build/P-*) T="${BRANCH#build/}" ;; esac
          # Self-hosted runners share load with the test shards; the 120 s export budget is measured on hosted runners (ruling 40: CI wall time is reported, not gating, while saturated).
          node scripts/shots/shots.mjs --target "$T" --out shots-out --max-export-s 600 --no-probes
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: shots-out
          retention-days: 14
          if-no-files-found: ignore
  perf:
    # Ruling 46: speed budgets are measured only here, on the two v1-perf runners (runner 14 on each CI server, cores 6-7 to themselves; the other runners share cores 0-5).
    runs-on: [self-hosted, linux, v1-perf]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deps
      - name: Export the web build and run the scroll probe (no screenshots)
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          T=all
          case "$BRANCH" in build/P-*) T="${BRANCH#build/}" ;; esac
          node scripts/shots/shots.mjs --target "$T" --out perf-out --max-export-s 600 --probes-only --trace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-traces
          path: perf-out/traces
          retention-days: 7
          if-no-files-found: ignore
      - name: theme_flash probe (zero wrong frames)
        run: node scripts/shots/theme-flash.mjs --skip-export
      - name: Browser perf probes (ruling 43, warm-up discarded, median of 5, worst printed) desktop 1x and phone 4x CPU
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          T=all
          case "$BRANCH" in build/P-*) T="${BRANCH#build/}" ;; esac
          node scripts/shots/probes/open.mjs --target "$T"
          node scripts/shots/probes/browser.mjs --target "$T" --size desktop
          node scripts/shots/probes/browser.mjs --target "$T" --size phone
