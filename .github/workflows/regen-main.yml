name: regen-main
# After every merge to main that changes manifests or host/modules.json: rebuild generated/ and docs/frozen/snapshots from the manifests on main itself and commit the difference as
# "chore(gen): regenerate". Branches are regenerated by regen.yml as before; this closes the gap that let main drift behind its manifests after two PRs merged near each other.
# If the repository refuses a bot push to main (branch protection) the script says so and exits 0; the next merge's run tries again.
on:
  push:
    branches: [main]
    paths:
      - 'manifests/**'
      - 'host/modules.json'
      - 'tools/gen/**'
      - 'lib/snapshot.ts'
      - '.github/workflows/regen-main.yml'
      - 'scripts/regen-bot.sh'
concurrency:
  group: regen-main
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  regen:
    # The bot's own commit touches only generated/ and docs/frozen/snapshots, which are outside the paths above; the guard is for a hand-made copy of that message.
    if: "${{ !startsWith(github.event.head_commit.message, 'chore(gen): regenerate') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Rebuild generated/ and the snapshots on main
        env:
          BRANCH: main
          PUSHED_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: bash scripts/regen-bot.sh
