name: desktop

on:
  workflow_call:
    inputs:
      only:
        description: "Run one job only (sandbox-windows, frame-macos), or update-proof: the Windows build and its update proof only, for diagnosis (the cut needs the full run)"
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      only:
        description: "Run one job only (sandbox-windows), to prove a lane's change without the full build; update-proof runs the Windows build and its update proof only, for diagnosis (the cut needs the full run)"
        required: false
        default: ""
  pull_request:
    paths:
      - "apps/desktop/**"
      - "apps/app/**"
      - "modules/engine/**"
      - "sandbox/**"
      - "agent/src/drivers/**"
      - "scripts/install/macos/**"
      - "scripts/install/linux/**"
      - ".github/workflows/desktop.yml"
      - "package-lock.json"
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "apps/app/**"
      - "modules/engine/**"
      - "sandbox/**"
      - "agent/src/drivers/**"
      - "scripts/install/macos/**"
      - "scripts/install/linux/**"
      - ".github/workflows/desktop.yml"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  desktop:
    if: ${{ !inputs.only || inputs.only == 'update-proof' }}
    name: desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # only=update-proof (diagnosis): the Windows leg alone, which builds the installer and runs the update proof over the shipped rc.18
        os: ${{ inputs.only == 'update-proof' && fromJSON('["windows-latest"]') || fromJSON('["macos-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # A built app checks for a newer Vyre when it opens and installs it (updater.rs); no test run of a build may update itself. Only the update proof below turns it back on.
    env:
      VYRE_NO_AUTO_UPDATE: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: desktop-${{ runner.os }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.toml') }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: A row lays out in WebKit when the page drops style text (owner-model.test.ts)
        # WebKit is the engine of the Mac app, and it is native on this runner. The Mac app's CSP (a style nonce) drops <style> text a script adds. VYRE_REQUIRE_BROWSERS=webkit makes a missing WebKit a failure.
        if: matrix.os == 'macos-latest'
        env:
          VYRE_REQUIRE_BROWSERS: webkit
        run: |
          set -o pipefail
          npx playwright-core install webkit
          node scripts/test-run.ts --no-cache --files scripts/shots/owner-model.test.ts 2>&1 | tee owner-model.out
          grep -q '^ok .*scripts/shots/owner-model.test.ts' owner-model.out
      - name: Export the web shell and stage the sidecar
        working-directory: apps/desktop
        run: |
          npm run web
          npm run stage
      - name: Rust unit tests
        run: cargo test --lib --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: License policy
        run: |
          cargo install cargo-deny --locked
          cargo deny --manifest-path apps/desktop/src-tauri/Cargo.toml check licenses bans
      - name: Build the shell
        working-directory: apps/desktop
        env:
          # Tauri skips the Finder layout when CI=true, which ships a plain window with no background. It runs here on a Mac that has a Finder; bundle_dmg gives osascript no time limit, so a stuck one is killed and the build fails.
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            rm -rf src-tauri/target/release/bundle/macos src-tauri/target/release/bundle/dmg
            ( while sleep 15; do
                now=$(date +%s)
                for p in $(pgrep osascript || true); do
                  started=$(date -j -f "%a %b %e %T %Y" "$(ps -o lstart= -p "$p")" +%s 2>/dev/null || echo "$now")
                  if [ $((now - started)) -gt 180 ]; then echo "osascript stuck for 3 minutes, killing it"; kill "$p" || true; fi
                done
              done ) &
            watchdog=$!
            trap 'kill "$watchdog" 2>/dev/null || true' EXIT
            npm run build:mac
          else
            npm run build:win
          fi
      - name: Verify the ad-hoc signature
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          app=apps/desktop/src-tauri/target/release/bundle/macos/Vyre.app
          codesign --verify --deep --strict "$app"
          codesign -dvvv "$app" 2>&1 | tee proof-codesign.txt
          grep -F "Signature=adhoc" proof-codesign.txt
          shopt -s nullglob
          dmgs=(apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg)
          [ "${#dmgs[@]}" -eq 1 ] || { echo "expected exactly one DMG, found ${#dmgs[@]}"; exit 1; }
          hdiutil verify "${dmgs[0]}"
      - name: The install window is really in the DMG, and how it looks
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg)
          [ "${#dmgs[@]}" -eq 1 ] || { echo "expected exactly one DMG, found ${#dmgs[@]}"; exit 1; }
          read -r ax ay bx by < <(node -e 'const d=require("./apps/desktop/src-tauri/tauri.conf.json").bundle.macOS.dmg;console.log(d.appPosition.x,d.appPosition.y,d.applicationFolderPosition.x,d.applicationFolderPosition.y)')
          apps/desktop/src-tauri/ci/dmg-window.sh "${dmgs[0]}" "$PWD/out" "$ax" "$ay" "$bx" "$by"
      - name: Mount, install and exercise the macOS DMG
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg)
          [ "${#dmgs[@]}" -eq 1 ] || { echo "expected exactly one DMG, found ${#dmgs[@]}"; exit 1; }
          mount="$RUNNER_TEMP/vyre-dmg"
          install_root="$RUNNER_TEMP/Vyre-Applications"
          installed="$install_root/Vyre.app"
          mkdir -p "$mount" "$install_root"
          attached=0
          cleanup() { if [ "$attached" = 1 ]; then hdiutil detach "$mount"; fi; }
          trap cleanup EXIT
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "${dmgs[0]}"
          attached=1
          apps=("$mount"/*.app)
          [ "${#apps[@]}" -eq 1 ] || { echo "expected exactly one app in the DMG, found ${#apps[@]}"; exit 1; }
          ditto "${apps[0]}" "$installed"
          hdiutil detach "$mount"
          attached=0
          codesign --verify --deep --strict "$installed"
          /usr/libexec/PlistBuddy -c "Print :NSMicrophoneUsageDescription" "$installed/Contents/Info.plist"
          codesign -dvvv "$installed" 2>&1 | tee -a proof-codesign.txt
          grep -F "Signature=adhoc" proof-codesign.txt
          # Ad-hoc signing proves bundle integrity but has no Developer ID or notarization ticket.
          # Gatekeeper must reject this release-candidate artifact rather than treating that result as a pass.
          if spctl --assess --type execute --verbose=4 "$installed" > proof-gatekeeper.txt 2>&1; then
            cat proof-gatekeeper.txt
            echo "an ad-hoc, non-notarized DMG unexpectedly passed Gatekeeper assessment"
            exit 1
          fi
          cat proof-gatekeeper.txt
          VYRE_SHELL_RELAUNCH=1 apps/desktop/src-tauri/ci/run-shell.sh "$installed/Contents/MacOS/vyre-desktop" "$PWD/out"
      - name: The bundle holds what a Personal Space needs, and its Node runs under the Seatbelt profile
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          installed="$RUNNER_TEMP/Vyre-Applications/Vyre.app"
          "$installed/Contents/MacOS/vyred" apps/desktop/src-tauri/ci/bundle-check.ts "$installed/Contents/Resources/runtime"
      - name: Personal Space, session import and a chat turn in the built app, then a restart
        if: runner.os == 'macOS'
        env:
          VYRE_PERSONAL_PROOF: "1"
        run: |
          set -euo pipefail
          installed="$RUNNER_TEMP/Vyre-Applications/Vyre.app"
          export VYRE_SHELL_APP="$installed/Contents/MacOS/vyre-desktop"
          node --test --test-force-exit --test-timeout=420000 --test-reporter=spec apps/desktop/tests/personal.heavy.test.ts 2>&1 | tee out/personal-heavy.log
          exit "${PIPESTATUS[0]}"
      - name: The Rust Personal-profile test against the real daemon
        if: runner.os == 'macOS'
        env:
          VYRE_TEST_NODE: ${{ runner.temp }}/node-for-rust
        run: |
          set -euo pipefail
          ln -sf "$(command -v node)" "$VYRE_TEST_NODE"
          cargo test --lib --manifest-path apps/desktop/src-tauri/Cargo.toml real_native_personal_profile_concurrency_and_restart -- --ignored --nocapture
      - name: The app updates itself on a real Mac, from a copy of the installed app (a bad signature refused, then a signed update installed with the daemons stopped first)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/Vyre-Update-Proof"
          rm -rf "$proof" && mkdir -p "$proof"
          ditto "$RUNNER_TEMP/Vyre-Applications/Vyre.app" "$proof/Vyre.app"
          raw="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/apps/desktop/src-tauri/ci"
          node apps/desktop/src-tauri/ci/update-proof.ts "$proof/Vyre.app/Contents/MacOS/vyre-desktop" "$proof/Vyre.app/Contents/MacOS/vyre-desktop" "$PWD/out/update-proof" "$raw/update-proof.json" "$raw/update-proof-badsig.json"
      - name: The DMG's name and SHA-256, a small file the release carries instead of the DMG until publish
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg)
          [ "${#dmgs[@]}" -eq 1 ] || { echo "expected exactly one DMG, found ${#dmgs[@]}"; exit 1; }
          name=$(basename "${dmgs[0]}")
          mkdir -p dmg-sum
          (cd "$(dirname "${dmgs[0]}")" && shasum -a 256 "$name") > "dmg-sum/$name.sha256"
          cat "dmg-sum/$name.sha256"
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with: { name: desktop-macOS-sha256, path: dmg-sum, if-no-files-found: error }
      - name: The update bundle Vyre.app.tar.gz and its BLAKE2b-512 digest, the one line that goes through sign (the app updates itself from it, scripts/release/updater.ts)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          mkdir -p upd-sum upd-bundle
          COPYFILE_DISABLE=1 tar -czf upd-bundle/Vyre.app.tar.gz -C apps/desktop/src-tauri/target/release/bundle/macos Vyre.app
          node scripts/release/cli.ts updater-digest upd-bundle/Vyre.app.tar.gz > upd-sum/Vyre.app.tar.gz.b2
          cat upd-sum/Vyre.app.tar.gz.b2
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with: { name: desktop-macOS-update-sum, path: upd-sum, if-no-files-found: error }
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with: { name: desktop-macOS-update, path: upd-bundle, if-no-files-found: error }
      - name: Exercise the packaged Windows shell and capture it
        if: runner.os == 'Windows'
        run: apps/desktop/src-tauri/ci/run-shell.sh "$PWD/apps/desktop/src-tauri/target/release/vyre-desktop.exe" "$PWD/out"
      - name: The Windows installer as VyreSetup.exe (the name install.ps1 downloads) and its SHA-256, a small file the release carries instead of the installer until publish
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          shopt -s nullglob
          # Tauri names the installer <productName>_<version>_<arch>-setup.exe
          exes=(apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe)
          [ "${#exes[@]}" -eq 1 ] || { echo "expected exactly one Windows installer, found ${#exes[@]}"; exit 1; }
          mkdir -p win-exe win-sum
          cp "${exes[0]}" win-exe/VyreSetup.exe
          # sha256sum on Windows writes binary mode ("<hash> *VyreSetup.exe"); release and the install script read the text form, two spaces
          sum=$(sha256sum win-exe/VyreSetup.exe | cut -c1-64)
          printf '%s  VyreSetup.exe\n' "$sum" > win-sum/VyreSetup.exe.sha256
          cat win-sum/VyreSetup.exe.sha256
          # the same installer is the Windows update bundle: its BLAKE2b-512 digest goes through sign beside the SHA-256
          node scripts/release/cli.ts updater-digest win-exe/VyreSetup.exe > win-sum/VyreSetup.exe.b2
          cat win-sum/VyreSetup.exe.b2
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with: { name: desktop-Windows-sha256, path: win-sum, if-no-files-found: error }
      - name: The app updates itself on a real Windows runner (VyreSetup.exe installed for this user, a bad signature refused, then a signed update installed by the NSIS updater with the daemons stopped first)
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # first the shipped rc.18, opened twice on a fresh profile (its blank second start is the bug this build fixes), then this build installed over it, as an update would
          gh release download v1.0.0-rc.18 -R "${{ github.repository }}" -p VyreSetup.exe -D shipped
          ./shipped/VyreSetup.exe //S
          node apps/desktop/src-tauri/ci/update-proof.ts --day-two "$LOCALAPPDATA/Vyre/vyre-desktop.exe" "$PWD/out/update-proof"
          ./win-exe/VyreSetup.exe //S
          app=""
          for d in "$LOCALAPPDATA/Vyre" "$LOCALAPPDATA/Programs/Vyre"; do if [ -f "$d/vyre-desktop.exe" ]; then app="$d/vyre-desktop.exe"; fi; done
          [ -n "$app" ] || { echo "VyreSetup.exe /S installed no vyre-desktop.exe"; find "$LOCALAPPDATA" -maxdepth 3 -iname 'vyre-desktop.exe' || true; exit 1; }
          raw="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/apps/desktop/src-tauri/ci"
          node apps/desktop/src-tauri/ci/update-proof.ts --kept-profile "$app" "$app" "$PWD/out/update-proof" "$raw/update-proof.json" "$raw/update-proof-badsig.json"
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with: { name: desktop-Windows-exe, path: win-exe, if-no-files-found: error }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-${{ runner.os }}
          path: |
            out
            proof-codesign.txt
            proof-gatekeeper.txt
            apps/desktop/src-tauri/target/release/bundle/dmg
            apps/desktop/src-tauri/target/release/bundle/nsis
          if-no-files-found: warn
  # The Mac's Seatbelt sandbox around CLI engines (Claude Code, Codex) on a real Mac: node starts under the exact profile, the full engine chain completes a turn with the fake CLI, MCP works over a
  # long socket path, a write outside the work folder is refused, and the real CLIs (installed on this runner only) start under the profile and do not die on a signal. Blocks the release because
  # release.yml calls this whole workflow.
  sandbox-macos:
    if: ${{ !inputs.only }}
    name: sandbox (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Claude Code and Codex, installed here only
        run: |
          set -euo pipefail
          cli="$RUNNER_TEMP/clis"
          mkdir -p "$cli"
          npm install --prefix "$cli" --no-audit --no-fund @anthropic-ai/claude-code@2.1.312 @openai/codex@0.166.0
          echo "VYRE_MAC_CLI_DIR=$cli" >> "$GITHUB_ENV"
          # outside the sandbox first: they run at all on this runner
          npx -y @anthropic-ai/claude-code@2.1.312 --version
          npx -y @openai/codex@0.166.0 --version
      - name: Under the exact Vyre profile
        env:
          VYRE_HEAVY_MAC: "1"
        run: |
          set -euo pipefail
          node --test --test-force-exit --test-reporter=spec modules/engine/tests/sandbox.mac.heavy.test.ts modules/engine/tests/mac-claude-signin.heavy.test.ts modules/engine/tests/cli.heavy.test.ts modules/engine/tests/sandbox.test.ts sandbox/tests/sandbox.escape.test.ts
          VYRE_HEAVY_DOCKER=1 node --test --test-force-exit --test-reporter=spec golden/steps/07-reply.heavy.test.ts
  # CLI engines on Windows: the local sockets the daemon makes (a named pipe, never a unix socket path a long profile folder breaks) and the MCP shim reaching Vyre over one from a
  # 120-character data folder. Blocks the release because release.yml calls this whole workflow.
  # The artifact viewer's frame in WebKit, the Mac app's engine (owner ruling, 4 Nov: the viewer was blank in the Mac app). The app's page frames the artifact host; the one-time code must become the
  # host's cookie inside the frame and the page must load. A WebKit that refuses the third-party cookie fails here, which is the signal to open the artifact in a top-level webview instead.
  frame-macos:
    if: ${{ !inputs.only || inputs.only == 'frame-macos' }}
    name: artifact frame (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: The artifact loads in a frame under WebKit and Chromium
        env:
          VYRE_REQUIRE_BROWSERS: webkit
        run: |
          npx playwright-core install webkit
          node --test --test-force-exit --test-reporter=spec test/artifact-frame.browser.test.ts

  sandbox-windows:
    if: ${{ !inputs.only || inputs.only == 'sandbox-windows' }}
    name: sandbox (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Local sockets and the MCP bridge
        run: node --test --test-force-exit --test-reporter=spec sandbox/tests/sock.test.ts modules/engine/tests/mcp-bridge.test.ts
      # A Windows Personal Space (owner ruling 3 Nov 2026): Claude Code at Low integrity in a Job Object, built and started by Vyre's own code. A turn with one Bash tool call against a fake
      # model API, git over HTTPS through the egress proxy, no change outside the work folder and the added folders, Vyre's own secrets unreadable, nothing left running after the job.
      - name: A Windows Personal Space, a real Claude Code turn, git, and what it may change
        env:
          VYRE_HEAVY_LOWIL: "1"
        timeout-minutes: 30
        run: node --test --test-force-exit --test-reporter=spec --test-timeout=1800000 modules/engine/tests/sandbox.lowil.heavy.test.ts
      # The Windows sandbox (sandbox/src/wsl): the runner has WSL2 and no distribution, like a person's computer with WSL on. Vyre imports its own, installs Linux Claude Code, and runs a turn
      # with one Bash tool call against a fake model API in the VM; then proves reads, writes and the network are held, and that the MCP shim reaches Vyre over the agent's relay.
      - name: The Windows sandbox, a real Claude Code turn and the denials
        env:
          VYRE_HEAVY_WSL: "1"
        timeout-minutes: 40
        run: node --test --test-force-exit --test-reporter=spec --test-timeout=2400000 modules/engine/tests/sandbox.wsl.heavy.test.ts
  # Windows parity for what other lanes built (lane l-winfix): the Windows-shaped unit tests on real Windows, then the real engines at Low integrity: claude.exe and codex.exe list their models
  # and end by themselves, native skills with bad names and a path past MAX_PATH are read by claude.exe, an added folder with a space is read and changed, git over SSH signs through the
  # ssh-agent service's named pipe, and Codex's plugin launcher starts a .cmd server. Run alone with only=winfix-windows.
  winfix-windows:
    if: ${{ !inputs.only || inputs.only == 'winfix-windows' }}
    name: winfix (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Windows-shaped unit tests, on Windows
        run: node --test --test-force-exit --test-reporter=spec sandbox/tests/sandbox.access.win.test.ts modules/engine/tests/skills-native.win.test.ts modules/engine/tests/sudo-shim.win.test.ts agent/tests/codex-server.win.test.ts agent/tests/drivers-cli.models-close.test.ts
      - name: The ssh-agent service and an SSH server for the proof
        shell: pwsh
        run: |
          Set-Service ssh-agent -StartupType Manual
          Start-Service ssh-agent
          Get-Service ssh-agent | Format-List Name,Status
          & C:\Windows\System32\OpenSSH\ssh.exe -V
          npm install --silent --no-audit --no-fund --prefix "$env:RUNNER_TEMP\ssh2" ssh2@1.16.0
          "VYRE_PROOF_SSH2=$env:RUNNER_TEMP\ssh2" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: The real engines at Low integrity
        env:
          VYRE_HEAVY_WINFIX: "1"
        timeout-minutes: 30
        run: node --test --test-force-exit --test-reporter=spec --test-timeout=1800000 modules/engine/tests/winfix.heavy.test.ts
  # Windows parity for the features of 3 Nov (lane l-winengine): each lane's own tests on real Windows and, beside it, the same steps on a Mac, one step per feature so the table reads off the run. The sandbox proofs (E, B, a
  # Team turn under B) are in sandbox-windows; the real engines with skills, model lists, folders and ssh are in winfix-windows. Run alone with only=parity-windows.
  parity-windows:
    if: ${{ !inputs.only || inputs.only == 'parity-windows' }}
    name: parity (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: "runson: Runs on, Automatic, the device link and handover"
        id: runson
        continue-on-error: true
        run: node --test --test-force-exit --test-reporter=spec test/runson.device.live.test.ts test/runson.handover.live.test.ts test/runson.pinned.live.test.ts test/runson.approvals.device.live.test.ts test/runson.approvals.space.live.test.ts modules/engine/tests/place.test.ts agent/tests/pool.placement.test.ts
      - name: "skills: native skills written for Claude Code and Codex"
        id: skills
        continue-on-error: true
        run: node --test --test-force-exit --test-reporter=spec modules/engine/tests/skills-native.test.ts modules/engine/tests/skills-native.win.test.ts
      - name: "livemodels: the engines' own model lists"
        id: livemodels
        continue-on-error: true
        run: node --test --test-force-exit --test-reporter=spec agent/tests/drivers-cli.models.test.ts modules/engine/tests/live-models.test.ts
      - name: "openweb: the internet rule, folders and ssh"
        id: openweb
        continue-on-error: true
        run: node --test --test-force-exit --test-reporter=spec sandbox/tests/sandbox.openweb.test.ts sandbox/tests/sandbox.access.win.test.ts modules/engine/tests/egress-log.test.ts modules/mounts/tests/engine-folders.test.ts apps/app/src/console/pages/internet-values.test.ts
      - name: "multidevice: a Personal Space on several computers"
        id: multidevice
        continue-on-error: true
        run: node --test --test-force-exit --test-reporter=spec test/peers.enrol.live.test.mjs test/peers.sync.live.test.mjs test/peers.trees.live.test.mjs test/peers.link.test.mjs modules/engine/tests/place.personal-peers.test.ts modules/network/tests/peers.test.ts host/tests/device-link.test.ts
      - name: The parity table
        if: always()
        run: |
          printf '| feature | ${{ matrix.os }} |\n|---|---|\n| runson | %s |\n| skills | %s |\n| livemodels | %s |\n| openweb | %s |\n| multidevice | %s |\n' "${{ steps.runson.outcome }}" "${{ steps.skills.outcome }}" "${{ steps.livemodels.outcome }}" "${{ steps.openweb.outcome }}" "${{ steps.multidevice.outcome }}" | tee -a "$GITHUB_STEP_SUMMARY"
          for o in "${{ steps.runson.outcome }}" "${{ steps.skills.outcome }}" "${{ steps.livemodels.outcome }}" "${{ steps.openweb.outcome }}" "${{ steps.multidevice.outcome }}"; do [ "$o" = success ] || exit 1; done
  # The Mac server installer on a real macOS runner: BSD tar, shasum, diskutil, plutil and the system LibreSSL beside Homebrew's OpenSSL 3. No Docker and no launchd changes.
  # Its unit tests (scripts/install/macos/install.test.ts) also run on the Linux runners with the main suite. There is no self-hosted macOS runner. A tag run skips it:
  # the release already ran it on the commit that was merged.
  installer-macos:
    if: ${{ github.ref_type != 'tag' && !inputs.only }}
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: The unit tests, on a real Mac as well
        run: node --test scripts/install/macos/install.test.ts scripts/install/linux/install.test.ts
      - name: The installer's steps on this Mac's own tools
        run: sh scripts/install/macos/install.real.test.sh
