name: check
# Per push affected-only checks, budget 5 minutes (ARCH-DECISIONS 13). Required checks on main: check, golden, budget.
on:
  push:
    branches-ignore: [main]
concurrency:
  group: push-${{ github.ref }}
  cancel-in-progress: true
jobs:
  select:
    runs-on: [self-hosted, linux, v1]
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.sel.outputs.matrix }}
      count: ${{ steps.sel.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Select affected tests and shard them
        id: sel
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          BASE="$BEFORE"
          if [ -z "$BASE" ] || echo "$BASE" | grep -Eq '^0+$'; then BASE=origin/main; fi
          git rev-parse --verify -q "$BASE" >/dev/null || BASE=origin/main
          node scripts/ci-select.ts "$BASE" --matrix > select.json
          node -e 'const r=JSON.parse(require("fs").readFileSync("select.json","utf8"));console.log("select: "+(r.all?"all":r.files.length+" files")+" "+r.why.join("; "));require("fs").appendFileSync(process.env.GITHUB_OUTPUT,"matrix="+JSON.stringify(r.matrix)+"\ncount="+r.matrix.include.length+"\n")'
  shards:
    name: ${{ matrix.name }}
    needs: select
    if: needs.select.outputs.count != '0'
    runs-on: [self-hosted, linux, v1]
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Run the shard (20 s file cap, pass cache by import hash)
        env:
          FILES: ${{ matrix.files }}
          SLOW: ${{ matrix.slow }}
        run: |
          if [ "$SLOW" = "true" ]; then node scripts/test-run.ts --slow --files $FILES; else node scripts/test-run.mjs --files $FILES; fi
  gates:
    # P-CI_03: ownership, boundaries, lint and typecheck run on every push, so evidence that claims them is verified here.
    runs-on: [self-hosted, linux, v1]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Lane from the branch name (build/P-L7_04 is L7a, build/P-L7b_05 is L7b, L9 is L9a, P-CI is L11, P-CC and P-PR are the lead's)
        id: lane
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          lane=""
          case "$BRANCH" in
            build/P-CI_02) lane=lead ;;   # contract steward: changes the contract types and the frozen hashes (ruling 25, 27)
            build/P-CI_*|build/P-CI-*) lane=L11 ;;
            build/P-CC_*|build/P-PR_*) lane=lead ;;
            *) lane="$(echo "$BRANCH" | sed -nE 's#^build/P-(L[0-9]+[a-z]?)_[0-9]+[a-z]?(-.*)?$#\1#p')"
              case "$lane" in L7) lane=L7a ;; L9) lane=L9a ;; esac ;;
          esac
          echo "lane=$lane" >> "$GITHUB_OUTPUT"
          echo "branch $BRANCH -> lane '${lane:-none}'"
      - name: Ownership (scripts/lanes-check.ts); generated/ edits made only by the regen bot are not the worker's
        if: steps.lane.outputs.lane != ''
        run: |
          git fetch -q origin main
          base="$(git merge-base origin/main HEAD)"
          orig="$(git rev-parse HEAD)"
          others="$(git log --format=%s "$base"..HEAD -- generated | grep -v '^chore(gen): regenerate' || true)"
          if [ -z "$others" ] && [ -n "$(git diff --name-only "$base"...HEAD -- generated)" ]; then
            git config user.name ci; git config user.email ci@example.invalid
            git checkout -q "$base" -- generated
            git commit -q -m "ci: drop bot-only generated/ from the ownership view"
          fi
          rc=0; node scripts/lanes-check.ts "${{ steps.lane.outputs.lane }}" "$base" || rc=$?
          git reset -q --hard "$orig"   # the later steps (drift check, boundaries) must see the real tree, bot-generated files included
          exit $rc
      - name: Layer boundaries B1 to B8 (scripts/boundaries.ts); main carries older violations, so only files this branch changed can fail it
        run: |
          git fetch -q origin main
          git diff --name-only --no-renames "$(git merge-base origin/main HEAD)"...HEAD > changed.txt
          node scripts/boundaries.ts > boundaries.out 2>&1 || true
          tail -n 1 boundaries.out
          if grep -Ff changed.txt boundaries.out | grep -E '^[A-Za-z0-9]+ [^ ]+' | grep -vE '^boundaries:' > mine.txt && [ -s mine.txt ]; then
            echo "boundary violations in files this branch changed:"; cat mine.txt; exit 1
          fi
          echo "no boundary violations in changed files"
      - name: Lints on the changed files (scripts/lint/run.ts)
        run: |
          git fetch -q origin main
          node scripts/lint/run.ts --base "$(git merge-base origin/main HEAD)"
      - name: Typecheck every package that has a tsconfig.json above a changed file
        run: |
          git fetch -q origin main
          base="$(git merge-base origin/main HEAD)"
          dirs=""
          for f in $(git diff --name-only --no-renames "$base"...HEAD | grep -E '\.(ts|tsx)$' || true); do
            d="$(dirname "$f")"
            while [ "$d" != "." ] && [ ! -f "$d/tsconfig.json" ]; do d="$(dirname "$d")"; done
            [ -f "$d/tsconfig.json" ] && dirs="$dirs $d"
          done
          dirs="$(echo $dirs | tr ' ' '\n' | sort -u)"
          [ -z "$dirs" ] && { echo "no package with a tsconfig.json changed"; exit 0; }
          tsc=tools/gen/node_modules/.bin/tsc
          [ -x "$tsc" ] || bash tools/gen/check.sh
          for d in $dirs; do echo "tsc -p $d"; "$tsc" -p "$d/tsconfig.json" --noEmit; done
  images-docker:
    # Ruling 31 and P-L8_HEAVY: when images/ or a heavy test changes, run the tests the 20 s shard cannot: the vyred image boots in Docker, the site builders
    # build and serve samples on real Docker, and a pinned Documenso container takes an envelope from create to completed. VYRE_HEAVY_DOCKER=1 turns the
    # Docker parts on (without it every one of these tests is skipped by name, and a skip is not a pass). Not part of the `check` gate below: it reports its own result on the run.
    runs-on: [self-hosted, linux, v1]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Did images/ or a heavy test change on this branch?
        id: scope
        run: |
          git fetch -q origin main
          base="$(git merge-base origin/main HEAD)"
          if git diff --name-only --no-renames "$base"...HEAD -- images/ modules/sites/ modules/esign/ | grep -q .; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; echo "no image or heavy test change; nothing to build"; fi
          if git diff --name-only --no-renames "$base"...HEAD -- images/vyred/ | grep -q .; then echo "vyred=true" >> "$GITHUB_OUTPUT"; else echo "vyred=false" >> "$GITHUB_OUTPUT"; fi
      - name: Docker is there
        if: steps.scope.outputs.changed == 'true'
        run: |
          docker version --format 'server {{.Server.Version}}'
          docker compose version || echo 'no docker compose plugin'
          docker-compose version || echo 'no docker-compose'
          docker buildx version || echo 'no buildx'
          docker info --format 'storage={{.Driver}} root={{.DockerRootDir}}' || true
          df -h /var/lib/docker 2>/dev/null | tail -n 1 || true
      - name: Build the vyred image, boot it, wait for healthy
        if: steps.scope.outputs.vyred == 'true'
        env:
          VYRE_HEAVY_DOCKER: "1"
        run: node --test --test-timeout=900000 images/vyred/smoke.heavy.test.ts
      - name: Pull the base images the site builders use (the test pulls nothing itself)
        if: steps.scope.outputs.changed == 'true'
        run: |
          for img in node:24-alpine python:3.13-slim caddy:2-alpine; do docker pull -q "$img"; done
      - name: Site builders on real Docker (modules/sites/tests/builders.heavy.test.ts)
        if: always() && steps.scope.outputs.changed == 'true'
        env:
          VYRE_HEAVY_DOCKER: "1"
        run: node --test --test-timeout=900000 --test-reporter=spec modules/sites/tests/builders.heavy.test.ts
      - name: Standalone docker compose (the runner has no compose plugin), pinned and checksum-verified
        id: compose
        if: always() && steps.scope.outputs.changed == 'true'
        run: |
          v=v2.40.3
          case "$(uname -m)" in x86_64) a=x86_64 ;; aarch64) a=aarch64 ;; *) echo "unsupported arch"; exit 1 ;; esac
          d="$RUNNER_TEMP/compose"; mkdir -p "$d"
          curl -fsSL -o "$d/docker-compose" "https://github.com/docker/compose/releases/download/$v/docker-compose-linux-$a"
          curl -fsSL -o "$d/sum" "https://github.com/docker/compose/releases/download/$v/docker-compose-linux-$a.sha256"
          (cd "$d" && echo "$(cut -d' ' -f1 sum)  docker-compose" | sha256sum -c -)
          chmod +x "$d/docker-compose"; "$d/docker-compose" version
          echo "bin=$d/docker-compose" >> "$GITHUB_OUTPUT"
      - name: Documenso e-sign against the pinned container (modules/esign/tests/documenso.heavy.test.ts)
        if: always() && steps.scope.outputs.changed == 'true'
        env:
          VYRE_HEAVY_DOCKER: "1"
          VYRE_COMPOSE_BIN: ${{ steps.compose.outputs.bin }}
        run: node --test --test-timeout=1500000 --test-reporter=spec modules/esign/tests/documenso.heavy.test.ts
      - name: Containers left behind
        if: always() && steps.scope.outputs.changed == 'true'
        run: docker ps -a --filter "name=vyre" --format '{{.Names}} {{.Status}}' || true
  check:
    needs: [select, shards, gates]
    if: always()
    runs-on: [self-hosted, linux, v1]
    timeout-minutes: 5
    steps:
      - name: Every shard passed or there was nothing to run
        env:
          SELECT: ${{ needs.select.result }}
          SHARDS: ${{ needs.shards.result }}
          GATES: ${{ needs.gates.result }}
        run: |
          [ "$GATES" = "success" ] || { echo "gates (ownership, boundaries, lint, typecheck): $GATES"; exit 1; }
          [ "$SELECT" = "success" ] || { echo "select: $SELECT"; exit 1; }
          case "$SHARDS" in success|skipped) ;; *) echo "shards: $SHARDS"; exit 1;; esac
  golden:
    runs-on: [self-hosted, linux, v1]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Golden flows (needs/pending mode lands with scripts/golden.ts, P-PR_63)
        run: npm run golden
  contracts:
    runs-on: [self-hosted, linux, v1]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Did contracts change?
        id: scope
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          BASE="$BEFORE"
          if [ -z "$BASE" ] || echo "$BASE" | grep -Eq '^0+$'; then BASE=origin/main; fi
          git rev-parse --verify -q "$BASE" >/dev/null || BASE=origin/main
          if git diff --name-only "$BASE"...HEAD | grep -Eq '^(manifests|packages/contracts|tools/gen|generated)/'; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
      - name: Regenerate into a scratch directory
        if: steps.scope.outputs.run == 'true'
        run: node tools/gen/src/cli.ts --out "$RUNNER_TEMP/generated" --summary || true
      - name: Upload the regenerated tree
        if: steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: generated
          path: ${{ runner.temp }}/generated
          if-no-files-found: ignore
          retention-days: 3
      - name: Contracts gate (drift check and typecheck)
        if: steps.scope.outputs.run == 'true'
        run: tools/gen/check.sh
  budget:
    permissions: { contents: read, actions: read }
    needs: [select, shards, check, golden]
    if: always()
    runs-on: [self-hosted, linux, v1]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Wall time of this run against the 5 minute push budget
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-budget.ts --kind push --run-id ${{ github.run_id }} --repo ${{ github.repository }}
      - name: Job times
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-report.ts --run-id ${{ github.run_id }} --repo ${{ github.repository }} >> "$GITHUB_STEP_SUMMARY"
