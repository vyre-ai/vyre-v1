name: install-macos

# The Mac server installer on a real macOS runner: BSD tar, shasum, diskutil, plutil and a real LibreSSL beside Homebrew's OpenSSL 3. No Docker, no launchd changes.
# The unit tests for the same script (scripts/install/macos/install.test.ts) run on the Linux runners with the main suite; there is no self-hosted macOS runner.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/install/macos/**"
      - "scripts/install/linux/**"
      - ".github/workflows/install-macos.yml"
  push:
    branches: [main]
    paths:
      - "scripts/install/macos/**"
      - "scripts/install/linux/**"
      - ".github/workflows/install-macos.yml"

permissions:
  contents: read

jobs:
  installer:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: The unit tests, on a real Mac as well
        run: node --test scripts/install/macos/install.test.ts scripts/install/linux/install.test.ts
      - name: The installer's steps on this Mac's own tools
        run: sh scripts/install/macos/install.real.test.sh
