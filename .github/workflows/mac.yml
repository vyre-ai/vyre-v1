name: mac
# P-CI_13: the Mac installer proven on a real macOS runner (S14, ARCH 13 R18). On demand only, never on push or pull request, so hosted macOS minutes stay small:
#   gh workflow run mac.yml --ref <branch>
# Runs scripts/install/mac/install.heavy.test.sh: the real install.sh with the pinned Colima, real launchd jobs, a site container and an agent computer, Caddy's network reaching both,
# a simulated restart, then uninstall --purge. It prints one "ok N" line per check and a "# perf s14" line (idle CPU, VM disk, data and tools size); both are in the job log and the artifact.
# A hosted macOS runner has FileVault off and may have no nested virtualization; the test fakes only the FileVault answer and says so, and a Colima that cannot start fails the run (a skip is not a pass).
on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label (macos-latest is Apple silicon; macos-13 is Intel)"
        required: false
        default: macos-latest
jobs:
  s14:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: The host
        run: |
          sw_vers; uname -m; sysctl -n hw.memsize hw.ncpu; df -h / | tail -n 1
          node --version
          brew install openssl@3 >/dev/null
          echo "VYRE_OPENSSL=$(brew --prefix openssl@3)/bin/openssl" >> "$GITHUB_ENV"
      - name: S14, the Mac installer on a real Mac (install.heavy.test.sh)
        env:
          VYRE_HEAVY_MAC: "1"
          VYRE_PERF_OUT: ${{ runner.temp }}/perf-s14.json
        run: |
          set -o pipefail
          sh scripts/install/mac/install.heavy.test.sh 2>&1 | tee s14.out
          grep -q '^# pass 9 fail 0$' s14.out
          ! grep -qi '^skipped' s14.out
          [ "$(grep -c '^ok ' s14.out)" = 9 ]
          grep '^# perf s14' s14.out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s14
          path: |
            s14.out
            ${{ runner.temp }}/perf-s14.json
          if-no-files-found: ignore
      - name: Left behind
        if: always()
        run: |
          ls /Library/LaunchDaemons | grep run.vyre || echo "no launchd jobs left"
          ls ~/.colima 2>/dev/null | head -n 3 || true
