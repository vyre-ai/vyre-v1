name: regen
# Ruling 22: workers never regenerate locally. On every push to a build/* branch, whatever paths changed (a test-only push on top of a manifest change must still find generated/ current),
# this job runs the generator, commits generated/ back as Irfad Imtiaz ("chore(gen): regenerate") and reruns the checks.
# A package.json change also refreshes package-lock.json (npm install --package-lock-only), committed in the same bot commit.
# A push made with GITHUB_TOKEN does not start other workflows, so the reruns happen inside scripts/regen-bot.sh
# (contracts gate plus the affected tests) and are reported as the commit status "regen-checks" on the new head.
on:
  push:
    branches: ['build/**']
concurrency:
  group: regen-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
  statuses: write
  actions: write   # gh workflow run check.yml on the bot's head
jobs:
  regen:
    # The bot's own commit never retriggers this (it only touches generated/), the guard is for a hand-made copy of that message.
    if: "${{ !startsWith(github.event.head_commit.message, 'chore(gen): regenerate') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: ./.github/actions/deps   # a hosted VM has no node_modules: the bot's generator, contracts gate and affected tests import workspace packages such as exceljs (modules/files)
      - name: Regenerate, commit generated/ back, rerun the checks
        env:
          BRANCH: ${{ github.ref_name }}
          PUSHED_SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: bash scripts/regen-bot.sh
