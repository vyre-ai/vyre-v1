# TEMPORARY (P-L10_06): runs the extension tests that need a real Chrome and uploads the screenshots; lives only on the tmp branch, never in the PR.
name: ext-agent-try
on:
  push:
    branches: ["tmp/P-L10_06-shots"]
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: playwright-core only (the extension has no other dependency)
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw" && npm init -y >/dev/null && npm i playwright-core@1.64.1 --no-audit --no-fund
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Extension tests with a real Chrome
        env:
          CHROME_BIN: /usr/bin/google-chrome
          VYRE_SHOT_DIR: ${{ github.workspace }}/ext-shots
        run: |
          mkdir -p ext-shots
          mkdir -p node_modules && ln -sfn "$RUNNER_TEMP/pw/node_modules/playwright-core" node_modules/playwright-core
          node --test --test-reporter=spec apps/chrome/tests/ext-core.test.ts apps/chrome/tests/ext-core.fill.test.ts apps/chrome/tests/ext-agent.test.ts apps/chrome/tests/ext-agent.real.test.ts 2>&1 | tee ext-shots/ext-agent.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ext-shots
          path: ext-shots
