name: run-shard
description: One shard of the test plan (scripts/ci-select.ts --matrix), run the same way by check.yml, main.yml and release.yml, so the three cannot drift. The caller has checked out the repository.
inputs:
  files:
    description: Space-separated test files of this matrix entry
    required: true
  slow:
    description: "true for a slow, heavy or perf entry (scripts/test-run.ts --slow), false for a fast shard"
    required: true
  runner:
    description: The matrix entry's runner (hosted, v1 or v1-perf)
    required: true
runs:
  using: composite
  steps:
    - name: Exclusive disk for a perf job (waits for the Docker-heavy jobs on this host)
      if: inputs.runner == 'v1-perf'
      shell: bash
      run: bash scripts/ci-iolock.sh exclusive
    - uses: ./.github/actions/deps
    - name: Chromium for a hosted slow shard (the self-hosted hosts have it; the live tests drive it, and a missing one fails the shard under --no-skip)
      if: runner.environment == 'github-hosted' && inputs.slow == 'true'
      shell: bash
      run: |
        npx playwright-core install chromium
        CHROME_BIN="$(node -e 'import("playwright-core").then((p) => console.log((p.chromium ?? p.default.chromium).executablePath()))')"
        test -x "$CHROME_BIN"
        echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
    - name: Bubblewrap can start on this runner (slow files run a CLI engine inside it; where Ubuntu 24.04 restricts unprivileged user namespaces a turn ends at once with no words)
      if: inputs.slow == 'true'
      shell: bash
      run: |
        command -v bwrap >/dev/null || { sudo -n apt-get update -q && sudo -n apt-get install -y -q bubblewrap; } || echo "bwrap is missing and could not be installed here"
        if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null)" = "1" ]; then sudo -n sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || echo "could not lift kernel.apparmor_restrict_unprivileged_userns on this runner"; fi
        sysctl kernel.apparmor_restrict_unprivileged_userns user.max_user_namespaces 2>/dev/null || true
        if bwrap --unshare-all --ro-bind /usr /usr --symlink usr/bin /bin --symlink usr/lib /lib --symlink usr/lib64 /lib64 --proc /proc --dev /dev /usr/bin/true; then echo "bwrap namespaces: ok"; else echo "bwrap namespaces: FAILED"; fi
    - name: Run the shard (30 s file cap, pass cache by import hash)
      shell: bash
      env:
        FILES: ${{ inputs.files }}
        SLOW: ${{ inputs.slow }}
        VYRE_PERF_RUN: ${{ inputs.runner == 'v1-perf' && '1' || '' }}   # perf files run only on the pinned perf host (test-run skips them elsewhere)
      run: |
        # Two files at a time: every runner of a host (eight, on eight cores) runs a shard at once, and four booted daemons per shard starved each other past the 30 s watchdog (dryrun.9, #676).
        if [ "$SLOW" = "true" ]; then NS=""; [ "$RUNNER_ENVIRONMENT" = "github-hosted" ] && NS="--no-skip"; node scripts/test-run.ts --slow --jobs 2 --files $FILES $NS; else NC=""; [ "$RUNNER_ENVIRONMENT" = "github-hosted" ] && NC="--no-cache"; node scripts/test-run.mjs --jobs 2 --files $FILES $NC; fi   # a hosted VM never reads a shared pass cache; on a hosted slow shard a skipped test is a failure (a missing Chromium must not pass as a skip)
