name: deps
description: Workspace dependencies from the host-local cache (one node_modules set per lockfile hash, hardlinked per runner). npm ci runs only on a miss, once per host.
inputs:
  workspace:
    description: Directory holding package-lock.json
    default: ${{ github.workspace }}
outputs:
  hit:
    description: "true when the set was already on the host"
    value: ${{ steps.deps.outputs.hit }}
  key:
    description: Lockfile hash the set is stored under
    value: ${{ steps.deps.outputs.key }}
  ms:
    description: Milliseconds the step took
    value: ${{ steps.deps.outputs.ms }}
runs:
  using: composite
  steps:
    # GitHub-hosted runners (P-CI_31): Node 24, and the node_modules set cached under RUNNER_TEMP keyed by the lockfiles. Self-hosted runners keep their host-local cache and their own node.
    - if: runner.environment == 'github-hosted'
      uses: actions/setup-node@v4
      with:
        node-version: 24
    - if: runner.environment == 'github-hosted'
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/deps-cache
        key: deps-${{ runner.os }}-${{ hashFiles('package-lock.json', '**/package.json') }}
    - id: deps
      shell: bash
      env:
        VYRE_DEPS_CACHE: ${{ runner.environment == 'github-hosted' && format('{0}/deps-cache', runner.temp) || '' }}
      run: bash "${{ github.workspace }}/scripts/ci-deps.sh" "${{ inputs.workspace }}"
