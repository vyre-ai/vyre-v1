# Server role: vyred with the Space, Caddy in front of it (spec 3.13, 5 b12), and the sites runner beside it. Written next to .env by the installer; run with
#   docker compose -f compose.server.yml up -d
# Caddy shares vyred's network namespace, so its admin API stays on loopback and the ports below are published once, on vyred.
# The sites runner (owner, 3 Nov) is the only service that holds the Docker socket. It also makes agent computers (3 Nov, rc.21): each on a network of its own with only its profile volume, so a Team Space
# server runs them with no setup beyond this file, and one agent's computer cannot reach another's. It has no network; vyred reaches it over a Unix socket in the vyre-sites-run volume with a token
# it writes there at each start, and it builds and runs only site containers and agent computers, each on a network of its own, inside fixed limits (host/src/sites-runner/policy.ts, computers-policy.ts). vyred (labelled
# vyre.ingress, with Caddy in its network namespace) is the one other container that joins a site's network, so Caddy can proxy to the site; vyred closes any connection that arrives on a
# site network's address, so sites never reach it, and sites never reach each other.
name: vyre-server

services:
  vyred:
    image: ${VYRE_IMAGE:-ghcr.io/vyre-ai/vyred:latest}
    restart: unless-stopped
    environment:
      VYRE_ROLE: space
      VYRE_DATA_DIR: /data
      VYRE_HOST: 0.0.0.0
      VYRE_PORT: "8420"
      VYRE_CADDY_ADMIN: http://127.0.0.1:2019
      VYRE_HEALTH_REQUIRE_CADDY: "1"
      VYRE_SPACE: ${VYRE_SPACE:-}
      VYRE_ADDRESS: ${VYRE_ADDRESS:-}
      VYRE_RELAY_URL: ${VYRE_RELAY_URL:-}
      # what the installer recorded: when the address or relay was last changed (the Space applies a change once), and the disk choice (the Console's health page shows it)
      VYRE_NETWORK_REV: ${VYRE_NETWORK_REV:-}
      VYRE_DISK_ENCRYPTION: ${VYRE_DISK_ENCRYPTION:-}
      VYRE_DISK_ENCRYPTION_SINCE: ${VYRE_DISK_ENCRYPTION_SINCE:-}
      VYRE_SITES_RUNNER: /run/vyre-sites/runner.sock
      # the agent computer image of this release, by digest (compose.env: the installer and vyre-server update write it from images.lock); the default is for a run without them
      VYRE_AGENT_COMPUTER_IMAGE: ${VYRE_AGENT_COMPUTER_IMAGE:-vyre/agent-computer:1}
      # the Space browser image of this release, by digest, the same way: one Chrome service for the Space host, a profile per agent (images/space-browser)
      VYRE_SPACE_BROWSER_IMAGE: ${VYRE_SPACE_BROWSER_IMAGE:-vyre/space-browser:1}
      # the agent workspace image of this release, by digest (the same way): every agent's shell and tmux live in a container from it
      VYRE_WORKSPACE_IMAGE: ${VYRE_WORKSPACE_IMAGE:-vyre/agent-workspace:1}
    env_file:
      - path: ./vyre.env
        required: false
    volumes:
      - vyre-data:/data
      - vyre-work:/work
      - vyre-sites-run:/run/vyre-sites
    ports:
      # 80 and 443 are open to the internet only with a domain; the installer writes VYRE_BIND=127.0.0.1 otherwise, so a relay server opens no public port
      - "${VYRE_BIND:-0.0.0.0}:80:80"
      - "${VYRE_BIND:-0.0.0.0}:443:443"
      - "127.0.0.1:${VYRE_PORT:-8420}:8420"
    labels:
      vyre.ingress: "1"
    depends_on:
      sites-runner:
        condition: service_started
    cap_drop: [ALL]
    # bubblewrap (the engine's sandbox) needs user namespaces and mounts, which Docker's default seccomp and AppArmor profiles refuse ("bwrap: No permissions to create new namespace").
    # The compute node's compose (scripts/install/linux/install.sh) does the same; the engine still runs inside bubblewrap with the network wall.
    security_opt:
      - no-new-privileges:true
      - seccomp=unconfined
      - apparmor=unconfined
      - systempaths=unconfined
    stop_grace_period: 20s

  sites-runner:
    image: ${VYRE_IMAGE:-ghcr.io/vyre-ai/vyred:latest}
    restart: unless-stopped
    command: ["node", "/opt/vyre/host/src/sites-runner/main.ts"]
    # root only to open the Docker socket (owned by root); every capability is dropped, the filesystem is read-only, and there is no network at all
    user: "0:0"
    environment:
      VYRE_SITES_RUNNER_SOCKET: /run/vyre-sites/runner.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - vyre-sites-run:/run/vyre-sites
    network_mode: none
    read_only: true
    # the image's own check asks vyred's port, which this service does not have: it is healthy while its socket is there
    healthcheck:
      test: ["CMD", "node", "-e", "require('fs').statSync('/run/vyre-sites/runner.sock')"]
      interval: 30s
      timeout: 5s
      retries: 3
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    restart: unless-stopped
    network_mode: "service:vyred"
    # service_started, not service_healthy: vyred's health check counts Caddy (VYRE_HEALTH_REQUIRE_CADDY), so waiting for vyred to be healthy
    # before starting Caddy would wait for ever.
    depends_on:
      vyred:
        condition: service_started
    # --resume: the routes vyred wrote come back after a restart; the Caddyfile is only the first start
    command: ["caddy", "run", "--resume", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true

volumes:
  vyre-data:
  vyre-work:
  caddy-data:
  caddy-config:
  vyre-sites-run:
